version: '3.8'

services:
  coap-gateway:
    build: .
    image: coap-gateway
    container_name: coap-gateway
    environment:
      - COAP_HOST=${COAP_HOST}
      - COAP_PORT=${COAP_PORT}
      - MQTT_BROKER=${MQTT_BROKER}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - POLL_INTERVAL=${POLL_INTERVAL}
      - METRICS_PORT=9090
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
